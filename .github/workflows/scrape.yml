name: Scrape GST/CBIC updates and email alerts

on:
  schedule:
    # Runs every hour, on the hour (UTC). GitHub's scheduler can lag a few
    # minutes at busy times — that's fine for this use case.
    - cron: "0 * * * *"
  workflow_dispatch:
    inputs:
      test_email:
        description: "Send a test email instead of scraping (for testing SMTP credentials)"
        type: boolean
        default: false
      reclassify:
        description: "One-time: backfill priority/softwareImpact on existing items (no scraping)"
        type: boolean
        default: false
      full_refresh:
        description: "Erase and redownload everything fresh from CBIC/GSTN (replaces data.json entirely, does not merge)"
        type: boolean
        default: false

permissions:
  contents: write # needed so the workflow can commit the updated data.json

jobs:
  scrape:
    runs-on: ubuntu-latest
    # Safety net: without this, a genuine hang in the script (e.g. a slow
    # site with no page-load timeout — see scrape_and_notify.py's
    # create_driver()) could consume GitHub Actions' default 6-hour job
    # timeout, blocking every subsequent hourly scheduled run until it's
    # manually cancelled. Real runs finish in 2-3 minutes; 10 is generous
    # headroom.
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Set up Chrome (needed for the GSTN Advisory scraper)
        uses: browser-actions/setup-chrome@v1

      - name: Scrape and notify
        env:
          # BUG FIX: without this, Python fully-buffers stdout when it
          # isn't a TTY (true of GitHub Actions' captured output), so
          # print() calls don't appear in the log until the process exits
          # or the buffer fills — discovered while debugging a suspected
          # hang (runs #40638557616/#40639231211, 2026-10-28): the log
          # showed literally zero script output, including the very first
          # print() line, right up to cancellation, making it impossible
          # to tell where execution actually was. PYTHONUNBUFFERED makes
          # every print() flush immediately, so the log reflects real
          # progress instead of appearing all at once at the end.
          PYTHONUNBUFFERED: "1"
          BREVO_SMTP_LOGIN: ${{ secrets.BREVO_SMTP_LOGIN }}
          BREVO_SMTP_KEY: ${{ secrets.BREVO_SMTP_KEY }}
          BREVO_SENDER_EMAIL: ${{ secrets.BREVO_SENDER_EMAIL }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          TEST_EMAIL_MODE: ${{ (github.event.inputs.test_email == 'true') && '1' || '0' }}
          RECLASSIFY_MODE: ${{ (github.event.inputs.reclassify == 'true') && '1' || '0' }}
          FULL_REFRESH_MODE: ${{ (github.event.inputs.full_refresh == 'true') && '1' || '0' }}
        run: python scrape_and_notify.py

      - name: Commit updated data if changed
        run: |
          git config user.name "gst-dashboard-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data.json
          git diff --cached --quiet || git commit -m "Update GST/CBIC data ($(date -u +%Y-%m-%dT%H:%M:%SZ))"
          # Pull-rebase before pushing, with a couple of retries — handles
          # the case where a manually-triggered run and the scheduled hourly
          # run happen to overlap and both try to push around the same time.
          for i in 1 2 3; do
            git pull --rebase && git push && break
            echo "Push attempt $i failed, retrying..."
            sleep 5
          done
